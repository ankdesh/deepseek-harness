name: Private product packages
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact commit on ankdesh-dsh (40 hex characters)
        required: true
        type: string
      publish:
        description: Publish after verification
        type: boolean
        default: false
      consumer_ref:
        description: Exact spec2gds commit to verify (40 hex characters)
        required: true
        default: b2f4f456a1fd66d09a658b799671ac39c73d1147
        type: string
      suffix:
        description: Unique package prerelease suffix
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: private-package-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'ankdesh/ankdesh-dsh-release' && github.ref == 'refs/heads/main' && github.actor == 'ankdesh'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: source
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/source/TEMP_consumer/TEMP_playwright
    steps:
      - name: Validate inputs
        working-directory: .
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          CONSUMER_REF: ${{ inputs.consumer_ref }}
          RELEASE_SUFFIX: ${{ inputs.suffix }}
        run: |
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CONSUMER_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_SUFFIX" =~ ^ankdesh\.[0-9]+$ ]]
      - uses: actions/checkout@v6
        with:
          repository: ankdesh/deepseek-harness
          ref: ankdesh-dsh
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Select source commit
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          git merge-base --is-ancestor "$SOURCE_REF" HEAD
          git checkout --detach "$SOURCE_REF"
          test -f scripts/package-release/framework-packages.json
      - uses: actions/checkout@v6
        with:
          repository: ankdesh/spec2gds
          ref: ${{ inputs.consumer_ref }}
          path: source/TEMP_consumer
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: source/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:native-system
      - run: pnpm run build:official
      - name: Check package tooling and web startup
        env:
          TMPDIR: ${{ github.workspace }}/source/TEMP_runtime
        run: |
          mkdir -p "$TMPDIR"
          node --test scripts/product-profile.test.mjs tools/product-tools/tests/*.test.mjs scripts/package-release/tests/*.test.mjs
          pnpm exec vitest run packages/bundle/web-app/tests
      - name: Pack candidate bytes
        env:
          RELEASE_SUFFIX: ${{ inputs.suffix }}
        run: node scripts/package-release/pack.mjs --product TEMP_consumer/ai-assistant --out TEMP_release --suffix "$RELEASE_SUFFIX"
      - name: Build consumer against candidate packages
        run: node scripts/package-release/verify.mjs --from TEMP_release --product TEMP_consumer/ai-assistant --out TEMP_development --development
      - name: Verify clean profile installs
        run: node scripts/package-release/verify.mjs --from TEMP_release --product TEMP_development/development --out "$RUNNER_TEMP/TEMP_verification"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare consumer test tools
        working-directory: source/TEMP_consumer
        run: |
          python -m pip install uv
          uv sync --frozen
          npm --prefix circuit-designer ci --no-audit --no-fund
          npm --prefix tests/ui-scenarios ci --no-audit --no-fund
          tests/ui-scenarios/node_modules/.bin/playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y verilator
      - name: Run required consumer acceptance profiles
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
        run: |
          node scripts/package-release/acceptance.mjs --consumer TEMP_consumer --development TEMP_development --verification "$RUNNER_TEMP/TEMP_verification"
          mv "$RUNNER_TEMP/TEMP_verification" TEMP_verification
      - name: Verify publication evidence
        run: node scripts/package-release/publish.mjs --from TEMP_release --verification TEMP_verification --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: tested-packages
          path: |
            source/TEMP_release/packages
            source/TEMP_release/release-manifest.json
            source/TEMP_release/release-manifest.sha256
            source/TEMP_verification/verification.json
            source/TEMP_verification/*.log
            source/TEMP_verification/spec2gds-*/package.json
            source/TEMP_verification/spec2gds-*/package-lock.json
            source/TEMP_verification/spec2gds-*/installed-packages.json
            source/TEMP_verification/spec2gds-*/measurements.json
            source/TEMP_verification/development
            source/TEMP_verification/application-*
          include-hidden-files: true
          if-no-files-found: error
  publish:
    needs: verify
    if: inputs.publish
    runs-on: ubuntu-24.04
    environment: package-release
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ankdesh/deepseek-harness
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@ankdesh'
      - uses: actions/download-artifact@v4
        with:
          name: tested-packages
          path: TEMP_tested
      - name: Check artifact commits
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          CONSUMER_REF: ${{ inputs.consumer_ref }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const manifest = JSON.parse(readFileSync("TEMP_tested/TEMP_release/release-manifest.json"));
            if (manifest.sourceCommit !== process.env.SOURCE_REF || manifest.consumerCommit !== process.env.CONSUMER_REF) {
              throw new Error("Release manifest commits differ from dispatch inputs");
            }
          '
      - name: Publish tested bytes
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/package-release/publish.mjs --from TEMP_tested/TEMP_release --verification TEMP_tested/TEMP_verification
      - name: Promote the complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_id=$(node -p 'JSON.parse(require("fs").readFileSync("TEMP_tested/TEMP_release/promotion.json")).releaseId')
          tar -czf TEMP_tested/TEMP_release/consumer-verification.tgz -C TEMP_tested/TEMP_release consumer-verification
          gh release create "harness-v$release_id" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Harness $release_id" --notes "Verified npm packages for selected product profiles." TEMP_tested/TEMP_release/release-manifest.json TEMP_tested/TEMP_release/release-manifest.sha256 TEMP_tested/TEMP_release/promotion.json TEMP_tested/TEMP_release/consumer-verification.tgz
